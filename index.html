<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>共有メモ</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header class="app-header">
    <div class="title-wrap">
      <input id="app-title" class="app-title" value="共有メモ" aria-label="アプリタイトル" />
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button id="sync-btn" class="menu-btn">同期</button>
      <button id="menu-btn" class="menu-btn" aria-label="メニュー">☰</button>
    </div>
  </header>

  <div id="menu" class="menu hidden" role="menu" aria-hidden="true">
    <button id="auth-btn" aria-label="サインイン">サインイン</button>
    <button id="save-file-btn">ファイル保存</button>
    <button id="settings-btn">設定</button>
  </div>

  <main>
    <section class="add-form">
      <textarea id="memo-input" placeholder="ここにメモを入力..." rows="3"></textarea>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="template-btn">定型文</button>
        <div id="template-popup" class="menu hidden" style="position:relative;left:0;top:0;">
          <div id="template-list" style="display:flex;flex-direction:column;gap:6px;padding:8px;min-width:200px"></div>
        </div>
      </div>
      <div class="form-actions">
        <button id="add-btn">追加</button>
      </div>
    </section>

    <section class="stats">
      <div id="memo-count">メモ: 0</div>
    </section>

    <section id="memo-list" class="memo-list" aria-live="polite"></section>
    <div id="show-all-wrap" class="show-all-wrap hidden">
      <button id="show-all-btn">すべて表示</button>
    </div>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
